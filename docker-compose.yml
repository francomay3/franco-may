# A local Postgres for developing the fornlämningar service.
#
# WHY THIS EXISTS. The service has two tables with opposite natures. fl_events
# is small, irreplaceable and written by real phones -- a local copy of it is
# worth little, because the production data IS the test, and a phone cannot
# reach this container without a port forward. fl_places, which the pipeline
# regenerates wholesale on every scoring change, is the opposite: 129k derived
# rows that get dropped and reloaded, and doing that against Neon is network,
# write cost and a `DROP TABLE` against the database that holds the real
# events. Locally it is COPY and a few seconds.
#
# So: everything the pipeline writes is developed here, and anything the phone
# has to talk to still goes against Neon.
#
# PORT 15432, NOT 5432, and that is not cosmetic. On some networks -- a laptop
# behind a corporate security agent, for one -- outbound 5432 is accepted and
# then reset the instant the Postgres handshake goes out. The symptom reads as
# ECONNRESET and looks exactly like a dead database; it cost real debugging
# time against Neon already (see lib/db.ts). Mapping to another port keeps
# that class of confusion away from the local database, which is the one place
# we want to be certain the network is not the problem.
#
# NO POOLER HERE, unlike production. lib/db.ts insists on the `-pooler` host
# for a reason that only exists in serverless: each cold start opens
# connections and never closes them, and Postgres runs out of connections long
# before it runs out of anything else. That failure cannot happen against this
# container, which means "it works locally" says nothing about it.
#
#   docker compose up -d
#   node scripts/apply-fl-schema.cjs --local
#
# The volume is named rather than a bind mount, so `docker compose down -v` is
# the honest way to start over and a stray `rm -rf` in the repo is not.
services:
  db:
    image: postgres:17
    # The credentials are deliberately trivial and identical to each other.
    # This listens on localhost only and holds nothing but regenerable data;
    # a real secret here would be a secret to leak for no gain.
    environment:
      POSTGRES_USER: fornkoll
      POSTGRES_PASSWORD: fornkoll
      POSTGRES_DB: fornkoll
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - fl_pgdata:/var/lib/postgresql/data
    # pg_isready with the user, because the default `postgres` role does not
    # exist in this image when POSTGRES_USER is set -- the check would fail
    # for ever while the database was perfectly up.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fornkoll -d fornkoll']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fl_pgdata:
